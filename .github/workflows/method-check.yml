name: method-check

# PDK-free known-answer checks of the measurement estimators in sim/lib.sh
# (issue #103). Runs from a disposable copy of the tracked tree; CI never
# commits evidence. Artifacts are method diagnostics, not device signoff.
# Local invocation: .github/scripts/check-all.sh method [artifact-dir] (the
# shared runner, issue #117; it requires ngspice 42 and forwards the artifact
# dir to .github/scripts/run-method-checks.sh -- see sim/README.md).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  known-answer:
    runs-on: ubuntu-24.04   # apt ngspice is 42.x (pinned by runner image)
    timeout-minutes: 10     # measured ~1 min of checks (incl. 38 s of deck rendering); generous for apt install
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install ngspice 42
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ngspice
          ngspice --version | grep -m1 'ngspice-'
          ngspice --version | grep -q 'ngspice-42' || { echo "expected ngspice-42" >&2; exit 1; }

      - name: Run known-answer checks
        run: .github/scripts/check-all.sh method "${RUNNER_TEMP}/method-check-artifacts"

      - name: Upload logs and records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: method-check-evidence
          path: ${{ runner.temp }}/method-check-artifacts
          if-no-files-found: warn
