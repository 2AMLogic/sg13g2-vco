name: lint

# Headless shellcheck gate at --severity=warning over tracked repo-owned
# scripts (issue #98). The file list and flags live in
# .github/scripts/lint-shell.sh so CI and `npm run lint` run the same command.
# Steps call named targets of .github/scripts/check-all.sh, the shared runner
# behind `npm test` / `npm run check:ci` / `npm run check:all` (issue #117).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint gate self-test
        run: .github/scripts/check-all.sh lint-selftest

      - name: Gate-runner self-test
        run: .github/scripts/check-all.sh runner-selftest

      - name: shellcheck (warning+)
        run: .github/scripts/check-all.sh lint
