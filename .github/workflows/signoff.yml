name: signoff

# T1 verdict-of-record gate — see signoff/README.md for the full
# contract. This job re-renders the klt signoff tier report from the
# committed block manifest and the vendored design-evidence-tiers doc,
# then fails on any byte-drift against signoff/t1-report.json, so a
# manifest citation whose artifact has since changed fails rather than
# rotting (issue #34).
#
# Headless and PDK-free like the repo's other checks: `klt signoff
# --manifest` on the current manifest grades only committed files, so
# this runner needs nothing but bash, python3 (stdlib) and the pinned
# klt wheel. It never mints evidence — refreshing the record is a
# deliberate developer action, never a CI side effect.
#
# Exit-code contract (klt docs/cli/signoff.md): 0 = all T1 items met,
# 3 = ran successfully with at least one unmet item. Both are clean runs;
# an all-unmet report is a correct verdict, not a CI failure. The
# checker self-test runs first — a drift gate that cannot fail is
# indistinguishable from no gate at all.
#
# Every step calls a named target of .github/scripts/check-all.sh, the shared
# runner behind `npm test` / `npm run check:ci` / `npm run check:all` (issue
# #117); the targets forward their arguments to the checkers unchanged.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned klt
        run: python3 -m pip install "klayout-tools==$(cat .github/klt-version)"

      - name: Drift-checker self-test
        run: .github/scripts/check-all.sh signoff-selftest

      - name: T1 verdict of record is current
        run: .github/scripts/check-all.sh signoff

  # Record currency (issue #122): sim/record-currency.json is the derived
  # index of which sim/**/records/ are current / superseded / unknown against
  # design/vco.spice. Stdlib python3 + git, full history so filename commits
  # resolve. Refresh: python3 .github/scripts/record_currency.py write
  record-currency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Record-currency classifier self-test
        run: .github/scripts/check-all.sh currency-selftest

      - name: Record-currency index is fresh
        run: .github/scripts/check-all.sh currency

      # Model-input integrity (issue #139): separate from currency. Retained
      # model-input manifests must match their committed snapshots; PDK/OSDI
      # roles stay external. Stdlib python3 only, no PDK.
      - name: Model-input integrity self-test
        run: .github/scripts/check-all.sh model-inputs-selftest

      - name: Committed model-input manifests match retained snapshots
        run: .github/scripts/check-all.sh model-inputs

      # Report/deck integrity (issue #143): separate from source currency. A
      # known paired report/deck sha256 mismatch fails unless explicitly
      # allowlisted with a justification; unpaired reports are "unchecked".
      - name: Report/deck integrity self-test
        run: .github/scripts/check-all.sh deck-integrity-selftest

      - name: No paired report/deck digest mismatch in sim records
        run: .github/scripts/check-all.sh deck-integrity

      # Friction ledger (issue #146): every cited klayout-tools issue has an
      # entry in .github/klt-friction-ledger.json, workaround paths exist and
      # entries are verified against .github/klt-version. Offline.
      - name: Friction-ledger gate self-test
        run: .github/scripts/check-all.sh friction-selftest

      - name: Friction ledger covers every citation and matches the klt pin
        run: .github/scripts/check-all.sh friction

  # Append-only sim/ evidence gate (issue #88). Pure bash + git: no klt, no
  # PDK. Needs full history so the PR merge-base is resolvable.
  sim-append-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Append-only checker self-test
        run: .github/scripts/check-all.sh append-only-selftest

      - name: Record-reservation self-test (no PDK, no simulator)
        run: .github/scripts/check-all.sh record-id-selftest

      - name: Tank A/B runner reservation self-test (no PDK, no simulator)
        run: .github/scripts/check-all.sh tank-ab-selftest

      - name: Local-grid guard self-test (no PDK, no simulator)
        run: .github/scripts/check-all.sh local-grid-guard-selftest

      - name: OSDI staging regression (stubbed compiler, no PDK, no network)
        run: .github/scripts/check-all.sh osdi-staging-selftest

      - name: sim/ evidence is append-only
        if: github.event_name == 'pull_request'
        run: .github/scripts/check-all.sh append-only

  # Layout evidence/GDS digest gate (issue #106). Pure bash + sha256sum +
  # python3 stdlib: no klt, no PDK.
  layout-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Layout-evidence checker self-test
        run: .github/scripts/test-check-layout-evidence.sh

      - name: Layout records vouch for the committed GDS
        run: .github/scripts/check-layout-evidence.sh

  spec-change-has-dr:
    # Presence check: an edit to spec/target-spec.md needs a
    # spec/decision-records/DR-NNN-slug.md in the same PR (issue #89).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Spec-DR checker self-test
        run: .github/scripts/check-all.sh spec-dr-selftest

      - name: Spec edit carries a decision record
        run: |
          .github/scripts/check-all.sh spec-dr \
            --base "origin/${{ github.base_ref }}" --head "${{ github.event.pull_request.head.sha }}"
