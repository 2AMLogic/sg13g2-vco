name: python

# Python gate (issue #118): every tracked *.py was previously ungated. Four
# jobs, all PDK-free and installing nothing but the pinned klayout wheel and numpy/scipy (venvs):
#   compile  - py_compile over all tracked *.py (syntax only, nothing imported)
#   stdlib   - stdlib unittest known-answer tests (tests/stdlib)
#   numeric  - numpy/scipy unittest tests (tests/numeric, issue #167), in a
#              throwaway venv from .github/numeric-requirements.txt
#   klayout  - unittest tests for the klayout-needing scripts (tests/klayout),
#              using the klayout pip wheel pinned in .github/klayout-pip-version
#              (a different pin from .github/klt-version, which is klayout-tools)
# The gate self-test runs first: a gate that cannot fail is indistinguishable
# from no gate. Steps call named targets of .github/scripts/check-all.sh, the
# shared runner behind `npm test` / `npm run check:ci` / `npm run check:all`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compile-and-stdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Python gate self-test (deliberately failing fixtures)
        run: .github/scripts/check-all.sh py-selftest

      - name: py_compile every tracked *.py
        run: .github/scripts/check-all.sh py-compile

      - name: Stdlib known-answer tests
        run: .github/scripts/check-all.sh py-tests

  numeric:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install numpy/scipy (throwaway venv)
        run: |
          python3 -m venv "$RUNNER_TEMP/numeric-venv"
          "$RUNNER_TEMP/numeric-venv/bin/python" -m pip install \
            -r .github/numeric-requirements.txt

      - name: Numeric known-answer tests (EM-extraction post/fit)
        env:
          PYTHON: ${{ runner.temp }}/numeric-venv/bin/python
        run: .github/scripts/check-all.sh py-numeric

  klayout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned klayout wheel (throwaway venv)
        run: |
          python3 -m venv "$RUNNER_TEMP/klayout-venv"
          "$RUNNER_TEMP/klayout-venv/bin/python" -m pip install \
            "klayout==$(cat .github/klayout-pip-version)"

      - name: klayout-dependent script tests
        env:
          PYTHON: ${{ runner.temp }}/klayout-venv/bin/python
        run: .github/scripts/check-all.sh py-klayout
